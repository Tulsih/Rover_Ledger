openapi: 3.0.3
info:
  title: Rover Ledger API
  description: |
    API documentation for Rover Ledger backend.
    Includes Microsoft OAuth 2.0 login, profile fetch, and profile update APIs built with Node.js, Express, and Drizzle ORM (PostgreSQL).
  version: 1.0.0
  contact:
    name: Rover Ledger Support
servers:
  - url: /
    description: Current Server (Relative / Auto-detect)
  - url: /rover-ledger
    description: Zrok Tunnel (/rover-ledger)
  - url: http://localhost:3003
    description: Localhost (Port 3003)
  - url: https://healthvault.share.zrok.io/rover-ledger
    description: Zrok Public Tunnel Server

tags:
  - name: Authentication
    description: Microsoft OAuth 2.0 login and token handling
  - name: User Profile
    description: Authenticated user profile retrieval and modification
  - name: Document Management
    description: Upload, filter, fetch, download, and soft delete documents synced to Microsoft OneDrive
  - name: System
    description: Health check and root information endpoints

paths:
  # ==========================================
  # AUTHENTICATION ENDPOINTS
  # ==========================================
  /auth/microsoft:
    post:
      tags:
        - Authentication
      summary: 1] Login with Microsoft (or Test Dummy Code)
      description: |
        Authenticates a user via Microsoft Azure / Entra ID.
        
        **Testing in Swagger (No Microsoft account needed)**:
        Pass `code: "dummy_code"` or `code: "shraddha"` to instantly log in / register the test user **Shraddha Chauhan** (`shraddha.chauhan@roverledger.com`) and receive a valid JWT token.

        **Production Flow**:
        1. An **authorization code** (`code`) from browser redirect flow.
        2. A **Microsoft access token** (`accessToken`) obtained directly from frontend MSAL.
        
        The API queries Microsoft Graph API (`/v1.0/me`) to extract user profile details (`Email`, `FirstName`, `LastName`, `FullName`, `Designation`), creates or syncs the user in `Rover_ledgers` table, and returns a signed JWT token.
      operationId: loginWithMicrosoft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Authorization code returned by Microsoft OAuth, or dummy code ("dummy_code" or "shraddha")
                  example: dummy_code
                accessToken:
                  type: string
                  description: Microsoft Access Token from MSAL frontend library
                  example: EwBAA8l6BAAU...
                redirectUri:
                  type: string
                  description: Redirect URI configured in Azure Entra ID (defaults to roverledger://auth)
                  example: roverledger://auth
                codeVerifier:
                  type: string
                  description: PKCE code_verifier generated by the mobile app during Microsoft authorization
                  example: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
            examples:
              dummyLoginShraddha:
                summary: Dummy Login (Creates & logs in Shraddha Chauhan)
                value:
                  code: dummy_code
              withCode:
                summary: Using Real Microsoft Authorization Code with PKCE
                value:
                  code: 0.AXoAsB_TuHG3kUeC4S4hGtVszc8qnsxb5Q1KkoEtgR2VVsxgAMw...
                  codeVerifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
                  redirectUri: roverledger://auth
              withAccessToken:
                summary: Using Microsoft Access Token (MSAL)
                value:
                  accessToken: EwBAA8l6BAAU...
      responses:
        '200':
          description: Login successful. Returns JWT token and user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Validation error or Microsoft authentication failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: 2] Refresh Access Token
      description: |
        Exchanges a valid **Refresh Token** for a new **Access Token** and a rotated **Refresh Token**.
        Implements automatic Refresh Token Rotation for security.
        If a previously rotated or revoked refresh token is presented, all active sessions for that user are terminated (replay attack prevention).
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: The long-lived Refresh Token received during login or previous refresh
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully. Returns new Access and Refresh tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Validation error (missing refreshToken).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token expired, invalid, or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: 4] Logout User
      description: |
        Logs out the user from the application.
        In the `Rover_ledgers` table, the user's `isActive` status is set to `false`.
        Accepts `Authorization: Bearer <token>` in the header, or `{ "email": "..." }` / `{ "UserId": "..." }` in the JSON body.
      operationId: logout
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: dharmik.b@techroversolutions.com
                  description: Optional user email if not sending Bearer token
                UserId:
                  type: string
                  format: uuid
                  example: 5b773c75-a477-4a85-8845-a4b7bfa4268b
                  description: Optional user ID if not sending Bearer token
      responses:
        '200':
          description: User logged out successfully and isActive set to false.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User logged out successfully
                  data:
                    type: object
                    properties:
                      UserId:
                        type: string
                        format: uuid
                        example: 5b773c75-a477-4a85-8845-a4b7bfa4268b
                      Email:
                        type: string
                        example: dharmik.b@techroversolutions.com
                      FullName:
                        type: string
                        example: Dharmik Bapodara
                      isActive:
                        type: boolean
                        example: false
        '400':
          description: Bad request or user not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized if an invalid or expired token was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # USER PROFILE ENDPOINTS
  # ==========================================
  /users/profile:
    get:
      tags:
        - User Profile
      summary: 2] Profile Fetch
      description: |
        Retrieves the profile details of the currently authenticated user from `Rover_ledgers` table.
        Requires a valid JWT Bearer token in the `Authorization` header.
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessResponse'
        '401':
          description: Unauthorized. Missing, expired, or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found or inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - User Profile
      summary: 3] Profile Update
      description: |
        Updates the profile fields for the authenticated user in the `Rover_ledgers` table.
        Automatically updates `UpdatedAt` timestamp and recalculates `FullName` if `FirstName` or `LastName` is modified without providing `FullName`.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            examples:
              updateInfo:
                summary: Update Name, Gender and Designation
                value:
                  FirstName: Jonathan
                  LastName: Smith
                  Gender: Male
                  Designation: Lead Financial Auditor
      responses:
        '200':
          description: Profile updated successfully. Returns updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessResponse'
        '400':
          description: Validation error (e.g. empty request body or invalid parameters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Invalid or missing token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  # ==========================================
  # SYSTEM ENDPOINTS
  # ==========================================
  /health:
    get:
      tags:
        - System
      summary: Health Check
      description: Returns service health status and current timestamp.
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    example: 2026-10-22T06:25:07.977Z

  /:
    get:
      tags:
        - System
      summary: Root API Info
      description: Basic information about the Rover Ledger API and available endpoints.
      operationId: rootInfo
      responses:
        '200':
          description: API Information.

  # ==========================================
  # DOCUMENT MANAGEMENT ENDPOINTS (MICROSOFT ONEDRIVE)
  # ==========================================
  /documents/upload:
    post:
      tags:
        - Document Management
      summary: Upload Image/Document to Microsoft OneDrive & Save to DB
      description: |
        Uploads an image (PNG, JPG, JPEG, WEBP, GIF) or any document file (PDF, DOCX, TXT, etc.) directly into the **RoverLedger** Microsoft OneDrive folder.
        The file metadata is persisted in the PostgreSQL `document_details` table.
      operationId: uploadDocument
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - documentName
                - documentType
                - documentDate
              properties:
                file:
                  type: string
                  format: binary
                  description: The image or document binary file
                documentName:
                  type: string
                  description: Name of the document entered by user
                  example: April 2026 Office Rent Invoice
                documentType:
                  type: string
                  enum: [income, expense]
                  description: Type of document (either 'income' or 'expense')
                  example: expense
                documentDate:
                  type: string
                  format: date
                  description: Date of document (YYYY-MM-DD or ISO string)
                  example: "2026-04-15"
                pdfCreated:
                  type: boolean
                  description: Whether a PDF is created
                  example: false
      responses:
        '201':
          description: Document uploaded to OneDrive and recorded in DB successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '400':
          description: Validation error or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents:
    get:
      tags:
        - Document Management
      summary: Fetch Active Documents for Authenticated User
      description: |
        Retrieves active documents (`softDelete = false`) uploaded by the currently authenticated user based on the Bearer Access Token.
        No filter parameters are required—simply click "Execute" to fetch this user's active documents.
        Also calculates and returns `incomeInvoiceCount` and `expenseInvoiceCount` scoped strictly to this user.
      operationId: getAllDocuments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated list of all active documents with invoice counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'

  /documents/filter:
    post:
      tags:
        - Document Management
      summary: Filter Documents (Request Body Only)
      description: |
        Filter documents by criteria passed in the **request body** (JSON).
        Does NOT rely on query parameters.
        If an **Authorization Bearer token** is provided in the headers, it automatically scopes the filtered results to documents uploaded by that authenticated user.
      operationId: filterDocuments
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                documentType:
                  type: string
                  enum: [income, expense]
                  description: Filter by document type ('income' or 'expense')
                  example: expense
                documentName:
                  type: string
                  description: Partial document name filter
                  example: Rent
                startDate:
                  type: string
                  format: date
                  description: Start of documentDate range (YYYY-MM-DD)
                  example: "2026-01-01"
                endDate:
                  type: string
                  format: date
                  description: End of documentDate range (YYYY-MM-DD)
                  example: "2026-12-31"
                pdfCreated:
                  type: boolean
                  description: Filter by whether PDF is created
                  example: false
                search:
                  type: string
                  description: Global search term matching documentName or originalFileName
                  example: invoice
                fileType:
                  type: string
                  description: MIME type filter (e.g. image, pdf)
                  example: image/jpeg
                page:
                  type: integer
                  description: Page number
                  default: 1
                  example: 1
                limit:
                  type: integer
                  description: Records per page
                  default: 10
                  example: 10
                sortBy:
                  type: string
                  enum: [createdAt, updatedAt, documentDate, documentName, fileSize]
                  default: createdAt
                order:
                  type: string
                  enum: [desc, asc]
                  default: desc
      responses:
        '200':
          description: Filtered document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'

  /documents/bulk:
    delete:
      tags:
        - Document Management
      summary: Bulk Soft Delete Documents
      description: |
        Soft deletes multiple documents by passing an array of document IDs.
        If an ID exists in the database and is not already soft-deleted (`softDelete = false`), it is updated to `softDelete = true`.
        IDs that are not found or already soft-deleted are safely skipped and reported in `notFoundOrAlreadyDeleted`.
      operationId: bulkSoftDeleteDocuments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
      responses:
        '200':
          description: Bulk soft delete completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
        '400':
          description: Validation error (e.g. empty or invalid IDs array)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/bulk-delete:
    post:
      tags:
        - Document Management
      summary: Bulk Soft Delete Documents (POST Alias)
      description: |
        POST alias for bulk soft deleting multiple documents. Useful for HTTP clients, libraries, and proxies that restrict or omit request bodies in DELETE calls.
      operationId: bulkSoftDeleteDocumentsPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
      responses:
        '200':
          description: Bulk soft delete completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{id}:
    get:
      tags:
        - Document Management
      summary: Get Document Details by ID
      description: Returns full metadata for a document including OneDrive item ID, web URL, and download link.
      operationId: getDocumentById
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the document
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSingleResponse'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Document Management
      summary: Soft Delete Document
      description: Marks the document as soft-deleted in the database (`softDelete = true`).
      operationId: softDeleteDocument
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the document
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document soft deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSingleResponse'
        '404':
          description: Document not found or already deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documents/{id}/download:
    get:
      tags:
        - Document Management
      summary: Download / Stream Document File from OneDrive
      description: Streams the original binary file directly from Microsoft OneDrive to the client.
      operationId: downloadDocument
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the document
          schema:
            type: string
            format: uuid
        - name: inline
          in: query
          description: View file directly in browser instead of attachment download
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Binary file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Document not found
        '502':
          description: Microsoft OneDrive streaming failure

# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Provide the JWT Bearer token obtained from `POST /auth/microsoft`.
        Example: `Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...`

  schemas:
    # User Profile Model
    User:
      type: object
      properties:
        UserId:
          type: integer
          description: Unique auto-incrementing user ID (Primary Key)
          example: 1
        FirstName:
          type: string
          nullable: true
          description: User's first name
          example: Jonathan
        LastName:
          type: string
          nullable: true
          description: User's last name
          example: Smith
        FullName:
          type: string
          nullable: true
          description: User's full display name
          example: Jonathan Smith
        Email:
          type: string
          format: email
          description: User's unique email address
          example: user@example.com
        Gender:
          type: string
          nullable: true
          description: User's gender
          example: Male
        Role:
          type: string
          description: Role for authorization
          example: User
        Designation:
          type: string
          nullable: true
          description: Job title / designation
          example: Lead Financial Auditor
        isActive:
          type: boolean
          description: Active status of the user account
          example: true
        CreatedAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: 2026-10-22T06:25:08.002Z
        UpdatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: 2026-10-22T06:28:12.450Z

    # Profile Update Request Schema
    ProfileUpdateRequest:
      type: object
      properties:
        FirstName:
          type: string
          description: User's first name
          example: Jonathan
        LastName:
          type: string
          description: User's last name
          example: Smith
        FullName:
          type: string
          description: User's full display name (optional, calculated automatically if omitted)
          example: Jonathan Smith
        Gender:
          type: string
          description: Gender (e.g. Male, Female, Other)
          example: Male
        Designation:
          type: string
          description: Job title / designation
          example: Lead Financial Auditor

    # Success Response Wrapper for Authentication
    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login with Microsoft successful
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: Short-lived JWT Access Token for authorization headers
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refreshToken:
              type: string
              description: Long-lived JWT Refresh Token for session refresh
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            tokenType:
              type: string
              example: Bearer
            expiresIn:
              type: integer
              description: Lifespan in seconds
              example: 900
            user:
              $ref: '#/components/schemas/User'

    # Success Response Wrapper for Profile
    ProfileSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User profile fetched successfully
        data:
          $ref: '#/components/schemas/User'

    # Error Response Schema
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid authentication token
        error:
          type: string
          nullable: true
          description: Optional error detail or stack trace

    # Document Details Model
    DocumentDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique document identifier
          example: 8e8c679a-c9ad-4e63-a21c-a99f36fcfb3d
        documentName:
          type: string
          description: Name given to document by user
          example: April 2026 Office Rent Invoice
        documentType:
          type: string
          enum: [income, expense]
          description: Document type
          example: expense
        fileSize:
          type: integer
          description: Size in bytes
          example: 1048576
        fileType:
          type: string
          description: MIME type of file
          example: image/jpeg
        documentDate:
          type: string
          format: date-time
          description: Date of document
          example: "2026-04-15T00:00:00.000Z"
        pdfCreated:
          type: boolean
          description: Flag indicating whether PDF is created
          example: false
        softDelete:
          type: boolean
          description: Soft delete status
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-10-27T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-27T10:00:00.000Z"
        oneDriveItemId:
          type: string
          description: Microsoft OneDrive item identifier
          example: 01TQSGEJX5O4F76N6CDJGI33YMJKODFDH3
        oneDriveWebUrl:
          type: string
          nullable: true
          description: Direct web link to preview on SharePoint / OneDrive
          example: https://techroverinc-my.sharepoint.com/...
        oneDriveDownloadUrl:
          type: string
          nullable: true
          description: Temporary download URL from Microsoft Graph
        originalFileName:
          type: string
          description: Original uploaded filename
          example: invoice_rent.jpg
        uploadedBy:
          type: string
          format: uuid
          nullable: true
          description: User ID who uploaded the file

    # Document Upload Response
    DocumentUploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Document uploaded and synced to Microsoft OneDrive successfully
        data:
          $ref: '#/components/schemas/DocumentDetails'

    # Document Single Response
    DocumentSingleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Document details fetched successfully
        data:
          $ref: '#/components/schemas/DocumentDetails'

    # Document List Response (Paginated)
    DocumentListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Documents fetched successfully
        data:
          type: object
          properties:
            rows:
              type: array
              items:
                $ref: '#/components/schemas/DocumentDetails'
            total:
              type: integer
              example: 42
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 42
            totalPages:
              type: integer
              example: 1
            incomeInvoiceCount:
              type: integer
              example: 24
            expenseInvoiceCount:
              type: integer
              example: 18

    # Bulk Delete Request
    BulkDeleteRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          description: Array of document UUIDs to soft delete
          example:
            - "b83a24d5-5ec9-48f8-b3d5-6bca9566236b"
            - "9f4c3218-1e4a-4933-bf44-7934c568910a"

    # Bulk Delete Response
    BulkDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Bulk soft delete completed. Successfully soft deleted 2 document(s).
        data:
          type: object
          properties:
            totalRequested:
              type: integer
              example: 3
            deletedCount:
              type: integer
              example: 2
            deletedIds:
              type: array
              items:
                type: string
                format: uuid
              example:
                - "b83a24d5-5ec9-48f8-b3d5-6bca9566236b"
                - "9f4c3218-1e4a-4933-bf44-7934c568910a"
            notFoundOrAlreadyDeleted:
              type: array
              items:
                type: string
              example:
                - "3d7b43a1-77e8-466d-9218-1c4b12345678"
            documents:
              type: array
              items:
                $ref: '#/components/schemas/DocumentDetails'
